[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recording-to-video-pipeline"
version = "0.1.0"
description = "Screen-recording to polished demo video pipeline"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.25",
    "anthropic>=0.28",
    "pytesseract>=0.3.10",
    "scenedetect[opencv]>=0.6",
    "gtts>=2.5",
    "edge-tts>=6.1",
    "sse-starlette>=2.1",
    "aiofiles>=23.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "redis>=5.0",
    "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
