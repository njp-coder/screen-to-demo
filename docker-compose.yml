version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rtv
      POSTGRES_PASSWORD: rtv
      POSTGRES_DB: rtv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: uvicorn pipeline.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./pipeline:/app
      - ./storage:/storage
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rtv:rtv@postgres:5432/rtv
      REDIS_URL: redis://redis:6379
      STORAGE_BASE_PATH: /storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./pipeline
      dockerfile: Dockerfile.worker
    command: python -m pipeline.worker.queue
    volumes:
      - ./pipeline:/app
      - ./storage:/storage
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rtv:rtv@postgres:5432/rtv
      REDIS_URL: redis://redis:6379
      STORAGE_BASE_PATH: /storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
